<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Papers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: monospace; min-height: 100vh; }
    nav {
      width: 10px;
      padding: 12px;
      border-left: 1px solid #eee;
      position: fixed;
      top: 0; right: 0; bottom: 0;
      overflow-y: auto;
    }
    nav ul { list-style: none; }
    nav li { margin: 1px 0; }
    nav a { color: #999; text-decoration: none; font-size: 11px; }
    nav a:hover { text-decoration: underline; }
    nav li.nav-head {
      font-size: 10px;
      color: #bbb;
      letter-spacing: 0.5px;
      margin-top: 8px;
      margin-bottom: 2px;
    }
    nav li.nav-back { margin-bottom: 4px; }
    main {
      max-width: 600px;
      padding: 20px 20px 40px;
      margin-left: 30px;
    }
    main h2, main h3 { margin-top: 24px; scroll-margin-top: 20px; }
    main ul { margin: 8px 0 16px 20px; }
    main li { margin: 4px 0; }
    main img { max-width: 100%; height: auto; display: block; margin: 16px auto; }
    pre { background: #f5f5f5; padding: 12px; overflow-x: auto; }
    a { color: #0057b7; }
    @media (max-width: 640px) {
      nav {
        position: static;
        width: 100%;
        border-left: none;
        border-bottom: 1px solid #eee;
        overflow-y: visible;
        display: flex;
      }
      nav ul { display: flex; flex-wrap: wrap; gap: 4px 10px; }
      main { margin-left: 0; }
    }
  </style>
</head>
<body>
  <nav>
    <ul>
      <li class="nav-back"><a href="../index.html">&larr; back</a></li>

    </ul>
  </nav>
  <main>

  </main>
</body>
</html>
